<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Books">
<meta name="theme-color" content="#f6f1e7">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Carol's Books</title>
<style>
  :root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2b2420;--mute:#8a7f74;--line:#e6ddcf;--acc:#8c3b2e;--acc2:#2f5d50}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
  h1{font:600 26px Georgia,"Times New Roman",serif;margin:0 0 8px}
  .tabs{display:flex;gap:6px}
  .tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 4px;border-radius:10px;font-size:15px}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tools{display:flex;gap:8px;margin-top:8px}
  .tools input,.tools select{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px;color:var(--ink)}
  .tools select{flex:0 1 auto;max-width:42%}
  main{padding:12px 16px}
  .count{color:var(--mute);font-size:14px;margin:4px 2px 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .card .t{font:600 18px Georgia,serif}
  .card .a{color:var(--mute);font-size:15px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pill{font-size:13px;padding:3px 9px;border-radius:99px;background:#efe7d8}
  .pill.f{background:#f3e0dc;color:var(--acc)} .pill.n{background:#dde9e4;color:var(--acc2)}
  .stars{color:#c08a1e;letter-spacing:1px}
  .note{margin-top:8px;font-size:15px;white-space:pre-wrap}
  .about{margin-top:8px;font-size:14px;color:var(--mute);line-height:1.35}
  .note a{color:var(--acc2);word-break:break-all}
  .empty{text-align:center;color:var(--mute);padding:40px 10px}
  .fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:34px;line-height:60px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
  dialog{border:0;padding:0;margin:0;width:100%;max-width:100%;height:100%;max-height:100%;background:var(--card);color:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  dialog::backdrop{background:rgba(0,0,0,.35)}
  @media (min-width:640px){dialog{margin:auto;width:560px;height:auto;max-height:90vh;border-radius:18px}}
  html.modal,html.modal body{overflow:hidden}
  .bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;background:var(--card);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 8px 8px}
  .bar h2{flex:1;margin:0;text-align:center;font:600 18px Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar button{flex:0 0 76px;padding:9px 6px;border:0;border-radius:10px;background:none;font-size:17px;color:var(--acc2)}
  .bar .pri{background:var(--acc);color:#fff;font-weight:600}
  .bar button:focus{outline:none}
  .fb{padding:4px 16px calc(24px + env(safe-area-inset-bottom))}
  label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
  form input,form select,form textarea{display:block;width:100%;max-width:100%;min-width:0;-webkit-appearance:none;appearance:none;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
  form input[type=month],form input[type=date]{min-height:44px;text-align:left}
  textarea{min-height:90px}
  .row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
  .seg{display:flex;gap:6px}.seg button{flex:1;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;color:var(--ink)}
  .seg button.on{background:var(--ink);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chips button{padding:7px 11px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:14px;color:var(--ink)}
  .chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .rate button{font-size:28px;background:none;border:0;color:#d8cbb4;padding:0 3px}.rate button.on{color:#c08a1e}
  .btns{display:flex;gap:8px;margin-top:20px}
  .btns button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;color:var(--ink)}
  .btns .pri{background:var(--acc);color:#fff;border-color:var(--acc)}
  .btns .del{color:#b3261e;flex:0 0 auto}
  .small{font-size:13px;color:var(--mute);text-align:center;margin:24px 0 6px}
  .small button{background:none;border:0;color:var(--acc2);font-size:13px;text-decoration:underline;padding:4px 8px}
  .group{margin-bottom:6px}
  .gact{display:flex;gap:8px;margin-top:10px}
  .gact button,.sbtn{padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:14px;color:var(--acc2)}
  .gact button.pri,.sbtn.pri{background:var(--acc2);color:#fff;border-color:var(--acc2)}
  .sbtn:disabled{color:var(--mute);background:none}
  .pill.sh{background:#dde9e4;color:var(--acc2)}
  .rv{font-style:italic}.rv a{color:var(--acc2)}
  .status{color:var(--mute);font-size:14px;margin:12px 2px}
  #msg{position:fixed;left:16px;right:90px;bottom:calc(26px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;font-size:14px;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
  #msg.on{opacity:.94}
  dialog.sm{height:fit-content;max-height:85vh;margin:auto;width:calc(100% - 32px);max-width:420px;border-radius:18px;padding:18px}
  dialog.sm h3{margin:0 0 6px;font:600 19px Georgia,serif}
  dialog.sm p{margin:0 0 10px;font-size:15px;color:var(--mute)}
  dialog.sm input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink)}
  .card{position:relative}.card.hc{padding-left:70px;min-height:92px}
  .card .cv{position:absolute;left:14px;top:12px;width:44px;height:66px;object-fit:cover;border-radius:4px;background:#efe7d8}
  .ac{border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:4px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .ac>div{display:flex;gap:10px;align-items:center;padding:7px 10px;border-top:1px solid var(--line);cursor:pointer}.ac>div:first-child{border-top:0}
  .ac img,.ac i{flex:0 0 30px;height:44px;border-radius:3px;object-fit:cover;background:#efe7d8}
  .ac>.hint{display:block;cursor:default;font-size:12px;color:var(--mute);padding:6px 10px}
  .ac p{margin:0;min-width:0}.ac b{display:block;font:600 15px/1.25 Georgia,serif}.ac span{font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1>Carol's Books</h1>
  <div class="tabs">
    <button data-tab="read" class="on">Read</button>
    <button data-tab="want">Want to read</button>
    <button data-tab="groups">Groups</button>
  </div>
  <div class="tools" id="tools">
    <input id="q" type="search" placeholder="Search title, author, person…">
    <select id="cat"></select>
  </div>
</header>
<main id="list"></main>
<div class="small">
  <button id="exp">Back up</button>·<button id="imp">Restore</button>·<button id="gr">Import from Goodreads</button>·<button id="dev">Use on another device</button>
  <input id="impf" type="file" accept=".json,application/json" hidden><input id="grf" type="file" accept=".csv,text/csv" hidden>
</div>
<button class="fab" id="add" aria-label="Add">+</button>

<dialog id="dlg"><form id="f" method="dialog" autocomplete="off"></form></dialog>
<dialog id="sh" class="sm"></dialog>
<script src="common.js?v=20261107g"></script>

<script>
const KEY='carol-books-v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{read:[],want:[],groups:[]};
db.groups=db.groups||[];
let tab='read';
const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));sync.mtime=Date.now();saveSync();schedulePush()};
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtDate=d=>{if(!d)return'';const[y,m,day]=d.split('-');return day?new Date(y,m-1,day).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):m?new Date(y,m-1).toLocaleString(undefined,{month:'short',year:'numeric'}):y};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
$('#cat').innerHTML='<option value="">All</option>'+Object.entries(GENRES).map(([c,gs])=>`<optgroup label="${c}"><option value="${c}">All ${c.toLowerCase()}</option>${gs.map(g=>`<option>${g}</option>`).join('')}</optgroup>`).join('');
const groupNames=()=>db.groups.map(g=>g.name).filter(Boolean);

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$('#tools').style.display=tab==='groups'?'none':'flex';render()});
$('#q').oninput=render;$('#cat').onchange=render;
$('#add').onclick=()=>edit(null);

function render(){
  const L=$('#list');
  if(tab==='groups'){
    L.innerHTML=db.groups.length?db.groups.map(g=>{
      const recs=db.want.filter(b=>b.group===g.name).length+db.read.filter(b=>b.group===g.name).length;
      return `<div class="card" data-id="${g.id}"><div class="t">${esc(g.name)}</div>${g.members?`<div class="a">${esc(g.members)}</div>`:''}<div class="meta">${g.meets?`<span class="pill">${esc(g.meets)}</span>`:''}<span class="pill">${recs} book${recs===1?'':'s'}</span>${g.token?'<span class="pill sh">Shared</span>':''}</div>${g.notes?`<div class="note">${link(g.notes)}</div>`:''}<div class="gact">${g.token?'<button type="button" class="open">Shared list</button>':''}<button type="button" class="share">Share link</button></div></div>`}).join('')
      :`<div class="empty">No book groups yet.<br>Tap + to add one.</div>`;
  }else{
    const q=$('#q').value.toLowerCase(),c=$('#cat').value;
    let items=db[tab].filter(b=>(!c||b.cat===c||b.genre===c)&&(!q||[b.title,b.author,b.by,b.group,b.genre,b.notes,b.reviewText,b.about].join(' ').toLowerCase().includes(q)));
    items.sort(tab==='read'?(a,b)=>(b.date||'').localeCompare(a.date||''):(a,b)=>(b.added||0)-(a.added||0));
    const n=db[tab].length;
    L.innerHTML=`<div class="count">${items.length}${items.length!==n?' of '+n:''} book${n===1?'':'s'}</div>`+(items.length?items.map(b=>`
      <div class="card${coverImg(b)?' hc':''}" data-id="${b.id}">${coverImg(b)}
        <div class="t">${esc(b.title)}</div>${b.author?`<div class="a">${esc(b.author)}</div>`:''}
        <div class="meta">
          ${b.cat?`<span class="pill ${b.cat==='Fiction'?'f':'n'}">${b.cat}</span>`:''}
          ${b.genre?`<span class="pill">${esc(b.genre)}</span>`:''}
          ${b.pages?`<span class="pill">${esc(b.pages)} pages</span>`:''}${b.year?`<span class="pill">${esc(b.year)}</span>`:''}
          ${tab==='read'&&b.date?`<span class="pill">${fmtDate(b.date)}</span>`:''}
          ${b.rating?`<span class="stars">${'★'.repeat(b.rating)}</span>`:''}
          ${recPill({rec:b.by,dateRec:b.dateRec})}
          ${b.group?`<span class="pill">${esc(b.group)}</span>`:''}
        </div>
        ${aboutHtml(b)}${reviewHtml(b)}
        ${b.notes?`<div class="note">${link(b.notes)}</div>`:''}
        ${tab==='want'?'<div class="gact"><button type="button" class="mkr">✓ Mark as read</button></div>':''}
      </div>`).join(''):`<div class="empty">${n?'Nothing matches.':tab==='read'?'No books yet.<br>Tap + to add one you’ve read.':'No books yet.<br>Tap + to add a recommendation.'}</div>`);
  }
  L.querySelectorAll('.card').forEach(el=>el.onclick=e=>{if(e.target.tagName==='A')return;
    const g=tab==='groups'&&db.groups.find(x=>x.id===el.dataset.id);
    if(g&&e.target.closest('.share'))return shareGroup(g);
    if(g&&g.token)return groupView(g);
    if(tab==='want'&&e.target.closest('.mkr'))return markRead(el.dataset.id);
    edit(el.dataset.id)});
}

// Want → Read: move the book, date it today, then open it so she can rate it / adjust the date.
function markRead(bid,o){const b=o||db.want.find(x=>x.id===bid);if(!b)return;db.want=db.want.filter(x=>x.id!==bid);
  const r={...b,date:b.date||today()};db.read.push(r);save();pushBook(r);document.querySelector('[data-tab=read]').click();edit(r.id)}
const bar=t=>`<div class="bar"><button type="button" class="cx">Cancel</button><h2>${esc(t)}</h2><button class="pri">Save</button></div>`;
const close=()=>$('#dlg').close();
$('#dlg').addEventListener('close',()=>document.documentElement.classList.remove('modal'));
$('#dlg').addEventListener('click',e=>{const r=$('#dlg').getBoundingClientRect();if(e.target===$('#dlg')&&(e.clientY<r.top||e.clientY>r.bottom||e.clientX<r.left||e.clientX>r.right))close()});
function edit(eid){
  const f=$('#f'),list=db[tab],it=eid?list.find(x=>x.id===eid):{};
  if(tab==='groups'){
    f.innerHTML=`${bar(`${eid?'Edit':'New'} group`)}<div class="fb">
      <label>Name</label><input name="name" required value="${esc(it.name)}">
      <label>Members</label><input name="members" value="${esc(it.members)}" placeholder="Sue, Linda, Mark…">
      <label>When it meets</label><input name="meets" value="${esc(it.meets)}" placeholder="2nd Tuesday">
      <label>Notes</label><textarea name="notes">${esc(it.notes)}</textarea>`;
  }else{
    const read=tab==='read',gl=groupNames();
    f.innerHTML=`${bar(eid?'Edit book':read?'Book I read':'Book to read')}<div class="fb">
      <label>Title</label><input name="title" required value="${esc(it.title)}"><input type="hidden" name="cover" value="${esc(it.cover)}">
      <div class="row"><div style="flex:3"><label>Author</label><input name="author" value="${esc(it.author)}"></div><div><label>Pages</label><input name="pages" type="number" inputmode="numeric" min="1" max="10000" value="${esc(it.pages)}"></div></div>
      <label>Year published</label><input name="year" inputmode="numeric" maxlength="4" value="${esc(it.year)}">
      <div class="row"><div style="flex:3"><label>Recommended by</label><input name="by" value="${esc(it.by)}"></div><div style="flex:2"><label>Date recommended</label><input name="dateRec" type="date" value="${esc(it.dateRec??(!eid&&!read?today():''))}"></div></div>
      <div class="row"><div><label>Category</label><input name="cat" value="${esc(it.cat)}" placeholder="Fills in automatically"></div><div style="flex:2"><label>Genre</label><input name="genre" value="${esc(it.genre)}" placeholder="Fills in automatically"></div></div>
      ${read?`<label>Date read</label><input name="date" type="date" value="${esc(/^\d{4}-\d{2}$/.test(it.date||'')?it.date+'-01':it.date)}">
      <label>My rating</label><div class="rate">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" class="${(it.rating||0)>=n?'on':''}">★</button>`).join('')}</div>`:''}
      <label>Book group</label><input name="group" list="gl" value="${esc(it.group)}"><datalist id="gl">${gl.map(g=>`<option value="${esc(g)}">`).join('')}</datalist>
      <label>About the book</label><textarea name="about" placeholder="Fills in when you pick a suggested title">${esc(it.about)}</textarea>
      <label>Review link</label><input name="review" type="url" inputmode="url" value="${esc(it.review)}" placeholder="https://…">
      <label>Notes</label><textarea name="notes">${esc(it.notes)}</textarea>`;
  }
  const st={rating:it.rating||0};
  f.innerHTML+=(eid?`<div class="btns">${tab==='want'?'<button type="button" class="mv">Mark read</button>':''}${tab==='groups'?'<button type="button" class="shr">Share link</button>':''}<button type="button" class="del">Delete</button></div>`:'')+'</div>';
  f.querySelectorAll('input').forEach(el=>{el.setAttribute('autocomplete','off');el.setAttribute('enterkeyhint','done');el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}})});
  f.querySelectorAll('.rate button').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;st.rating=st.rating===n?0:n;f.querySelectorAll('.rate button').forEach(x=>x.classList.toggle('on',+x.dataset.n<=st.rating))});
  const gi=f.querySelector('[name=genre]'),ci=f.querySelector('[name=cat]');
  if(ci){const fv=n=>f.querySelector(`[name=${n}]`);
    const applyCat=b=>{if(!ci.value&&b.cat)ci.value=b.cat;if(!gi.value&&b.genre)gi.value=b.genre};
    bookAC(fv('title'),b=>{fillPicked(f,b,applyCat);applyCat(b)})}
  const collect=()=>{const o={...it,...Object.fromEntries(new FormData(f))};if(tab!=='groups')o.cat=normCat(o.cat);if(tab==='read')o.rating=st.rating;return o};
  f.querySelector('.cx').onclick=close;
  const del=f.querySelector('.del');if(del)del.onclick=()=>{if(confirm('Delete this?')){db[tab]=list.filter(x=>x.id!==eid);save();close();render()}};
  const shr=f.querySelector('.shr');if(shr)shr.onclick=()=>shareGroup(it);
  const mv=f.querySelector('.mv');if(mv)mv.onclick=()=>{const o=collect();close();markRead(eid,o)};
  f.onsubmit=e=>{e.preventDefault();if(!f.reportValidity())return;const o=collect();
    let rec=it;
    if(tab==='groups'){if(eid&&it.name!==o.name)renameGroup(it,o.name)}
    if(eid)Object.assign(it,o);else list.push(rec={...o,id:id(),added:Date.now()});
    save();close();render();if(tab!=='groups')pushBook(rec)};
  document.documentElement.classList.add('modal');$('#dlg').showModal();$('#dlg').scrollTop=0;f.querySelector('.cx').focus({preventScroll:true});
}

$('#exp').onclick=async()=>{
  const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'}),name=`books-backup-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
};
$('#dev').onclick=()=>shareLib();
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!d.read||!d.want)throw 0;if(confirm('Replace everything here with this backup?')){db={groups:[],...d};save();render()}}catch{alert('That file isn’t a books backup.')}e.target.value=''};

// ---------- Goodreads import (their library export CSV) ----------
function parseCSV(s){const rows=[];let row=[],v='',q=false;s=s.replace(/^﻿/,'');
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){if(c==='"'){if(s[i+1]==='"'){v+='"';i++}else q=false}else v+=c}
    else if(c==='"')q=true;else if(c===','){row.push(v);v=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);rows.push(row);row=[];v=''}else v+=c}
  if(v||row.length){row.push(v);rows.push(row)}return rows}
const grText=h=>h.replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&(amp|lt|gt|quot|#39);/g,(m,e)=>({amp:'&',lt:'<',gt:'>',quot:'"','#39':"'"}[e])).trim();
$('#gr').onclick=()=>$('#grf').click();
$('#grf').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;
  const rows=parseCSV(await file.text()),H=rows.shift()||[],col=n=>H.indexOf(n);
  if(col('Title')<0||col('Exclusive Shelf')<0)return alert('That isn’t a Goodreads export. In Goodreads: My Books → Import and export → Export library.');
  const g=(r,n)=>(r[col(n)]||'').replace(/^="?(.*?)"?$/,'$1').trim(),key=b=>(b.title+'\u0001'+(b.author||'')).trim().toLowerCase().replace(/\s+/g,' ');
  const seen={read:new Set(db.read.map(key)),want:new Set(db.want.map(key))},add={read:[],want:[]};let dup=0;
  rows.forEach((r,i)=>{const title=g(r,'Title');if(!title)return;
    const L=g(r,'Exclusive Shelf')==='read'?'read':'want',d=g(r,'Date Read').replace(/\//g,'-'),pg=parseInt(g(r,'Number of Pages')),rt=parseInt(g(r,'My Rating'))||0,da=Date.parse(g(r,'Date Added').replace(/\//g,'-'));
    const b={title,author:g(r,'Author').replace(/\s+/g,' '),pages:pg>0&&pg<=10000?pg:'',year:(g(r,'Original Publication Year')||g(r,'Year Published')).replace(/\D/g,'').slice(0,4),publisher:g(r,'Publisher'),by:'',...guessGenre(g(r,'Bookshelves').split(/,\s*/)),group:'',reviewText:grText(g(r,'My Review')),review:'',notes:'',id:id()+i.toString(36),added:isNaN(da)?Date.now()-i:da};
    if(L==='read'){b.date=/^\d{4}-\d{2}-\d{2}$/.test(d)?d:'';b.rating=rt>=1&&rt<=5?rt:0}
    if(seen[L].has(key(b)))return dup++;seen[L].add(key(b));add[L].push(b)});
  const n=add.read.length,m=add.want.length;
  if(!n&&!m)return alert(dup?'All of these books are already here.':'No books found in that file.');
  if(!confirm(`Import ${n} read and ${m} to-read book${n+m===1?'':'s'}?${dup?` (${dup} already here will be skipped.)`:''}`))return;
  db.read.push(...add.read);db.want.push(...add.want);save();render();msg(`Imported ${n+m} book${n+m===1?'':'s'}.`)};

// ---------- shared book groups ----------
const gByName=n=>db.groups.find(g=>g.name&&g.name===n);
const toShared=b=>({title:b.title,author:b.author,cat:b.cat||'',genre:b.genre,pages:b.pages||'',year:b.year||'',publisher:b.publisher||'',cover:b.cover||'',by:'Carol',rec:b.by||'',dateRec:b.dateRec||'',about:(b.about||'').slice(0,2000),review:/^https?:\/\//i.test(b.review||'')?b.review:'',reviewText:(b.reviewText||'').slice(0,1000),notes:(b.notes||'').slice(0,2000)});
// Push one of Carol's books to its shared group (create or update). Never throws.
async function pushBook(b,quiet){
  const g=b&&b.group&&gByName(b.group);if(!g||!g.token)return true;
  if(b.sid&&b.stok===g.token&&!b.sown)return true;          // came from the group; not hers to push
  try{
    if(b.sid&&b.stok===g.token)await api('PUT',`/groups/${g.token}/books/${b.sid}`,toShared(b)).catch(e=>{if(e.status!==404)throw e});
    else{const r=await api('POST',`/groups/${g.token}/books`,toShared(b));Object.assign(b,{sid:r.id,stok:g.token,sown:true})}
    delete b.dirty;save();return true;
  }catch(e){b.dirty=1;save();if(!quiet)msg(`Saved here — couldn’t share to “${g.name}” yet (offline?). Will retry.`);return false}
}
async function syncPending(){for(const b of [...db.want,...db.read])if(b.dirty&&!(await pushBook(b,true)))return false;return true}
function renameGroup(g,name){
  [...db.want,...db.read].forEach(b=>{if(b.group===g.name)b.group=name});
  if(g.token)api('PATCH',`/groups/${g.token}`,{name}).catch(()=>msg('Renamed here — couldn’t update the shared list name.'));
}
function linkBox(title,sub,url,shareTitle){
  const d=$('#sh');
  d.innerHTML=`<h3>${esc(title)}</h3><p>${esc(sub)}</p><input readonly value="${esc(url)}"><div class="btns" style="margin-top:12px">${navigator.share?'<button type="button" class="pri s">Share…</button>':''}<button type="button" class="c">Copy</button><button type="button" class="x">Done</button></div>`;
  const inp=d.querySelector('input');inp.onclick=()=>inp.select();
  const s=d.querySelector('.s');if(s)s.onclick=()=>navigator.share({title:shareTitle,url}).catch(()=>{});
  d.querySelector('.c').onclick=async e=>{try{await navigator.clipboard.writeText(url)}catch{inp.select();document.execCommand('copy')}e.target.textContent='Copied ✓'};
  d.querySelector('.x').onclick=()=>d.close();
  d.showModal();
}
async function shareGroup(g){
  if(!g.name)return;
  if(!g.token){
    try{const r=await api('POST','/groups',{name:g.name});g.token=r.token;save();render()}
    catch(e){return msg('Couldn’t make a share link — check your connection and try again.')}
    const mine=[...db.want,...db.read].filter(b=>b.group===g.name&&!b.sid);
    if(mine.length&&confirm(`Also add the ${mine.length} book${mine.length===1?'':'s'} already tagged “${g.name}” to the shared list?`)){
      mine.forEach(b=>b.dirty=1);save();if(!(await syncPending()))msg('Some books couldn’t be shared yet — will retry.')}
    return linkBox('Share link ready',`Anyone with this link can see and add books to “${g.name}”. They won’t see your own lists.`,SHARE_BASE+g.token,g.name);
  }
  const url=SHARE_BASE+g.token;
  if(navigator.share){try{await navigator.share({title:g.name,url});return}catch(e){if(e.name==='AbortError')return}}
  linkBox('Share link',`Anyone with this link can see and add books to “${g.name}”.`,url,g.name);
}
function groupView(g){
  const f=$('#f');
  f.innerHTML=`<div class="bar"><button type="button" class="cx">Close</button><h2>${esc(g.name)}</h2><button type="button" class="pri sh2">Share</button></div><div class="fb"><div class="status">Loading shared books…</div><div class="gl"></div>
    <div class="btns"><button type="button" class="ed">Edit group</button></div></div>`;
  f.onsubmit=e=>e.preventDefault();
  f.querySelector('.cx').onclick=close;f.querySelector('.sh2').onclick=()=>shareGroup(g);
  f.querySelector('.ed').onclick=()=>{close();edit(g.id)};
  const st=f.querySelector('.status'),gl=f.querySelector('.gl');
  const have=b=>[...db.want,...db.read].some(x=>x.sid===b.id||(x.title||'').trim().toLowerCase()===b.title.trim().toLowerCase()&&(x.author||'').trim().toLowerCase()===(b.author||'').trim().toLowerCase());
  const draw=books=>{books.sort((a,b)=>b.added-a.added);
    st.textContent=`${books.length} shared book${books.length===1?'':'s'}`;
    gl.innerHTML=books.length?books.map(b=>`<div class="card${coverImg(b)?' hc':''}">${coverImg(b)}<div class="t">${esc(b.title)}</div>${b.author?`<div class="a">${esc(b.author)}</div>`:''}
      <div class="meta">${b.cat?`<span class="pill ${b.cat==='Fiction'?'f':'n'}">${esc(b.cat)}</span>`:''}${b.genre?`<span class="pill">${esc(b.genre)}</span>`:''}${b.pages?`<span class="pill">${esc(b.pages)} pages</span>`:''}${b.year?`<span class="pill">${esc(b.year)}</span>`:''}${recPill(b)}${b.by?`<span class="pill">added by ${esc(b.by)}</span>`:''}</div>
      ${reviewHtml(b)}${b.notes?`<div class="note">${link(b.notes)}</div>`:''}
      <div class="gact">${have(b)?'<button type="button" class="sbtn" disabled>✓ In your lists</button>':`<button type="button" class="sbtn pri" data-sid="${esc(b.id)}">Add to Want to read</button>`}</div></div>`).join('')
      :`<div class="empty">No shared books yet.<br>Books you save with this group, and ones friends add from the link, show up here.</div>`;
    gl.querySelectorAll('[data-sid]').forEach(btn=>btn.onclick=()=>{const b=books.find(x=>x.id===btn.dataset.sid);
      db.want.push({title:b.title,author:b.author,cover:b.cover,cat:b.cat,genre:b.genre,pages:b.pages,year:b.year||'',publisher:b.publisher||'',by:b.rec||b.by,dateRec:b.dateRec||'',about:b.about||'',group:g.name,review:b.review,reviewText:b.reviewText,notes:b.notes,id:id(),added:Date.now(),sid:b.id,stok:g.token,sown:false});
      save();btn.disabled=true;btn.classList.remove('pri');btn.textContent='✓ Added to Want to read'})};
  api('GET',`/groups/${g.token}`).then(d=>draw(d.books)).catch(e=>{st.textContent=e.status===404?'This shared list no longer exists.':'Couldn’t load the shared list — check your connection.'});
  document.documentElement.classList.add('modal');$('#dlg').showModal();$('#dlg').scrollTop=0;
}

// ---------- cross-device library sync ----------
const SKEY='carol-books-sync';
let sync=JSON.parse(localStorage.getItem(SKEY)||'null')||{lib:'',mtime:0,synced:0};
const saveSync=()=>localStorage.setItem(SKEY,JSON.stringify(sync));
const isEmpty=d=>!d||!((d.read||[]).length||(d.want||[]).length||(d.groups||[]).length);
const adopt=(rdb,ts)=>{db={read:[],want:[],groups:[],...rdb};localStorage.setItem(KEY,JSON.stringify(db));sync.mtime=sync.synced=ts;saveSync();render()};
let pushT=0,pushing=null;
function schedulePush(){clearTimeout(pushT);pushT=setTimeout(pushLib,800)}
async function pushLib(){
  if(pushing)return pushing.then(schedulePush);
  pushing=(async()=>{try{
    if(!sync.lib){const r=await api('POST','/libs',{db,updatedAt:sync.mtime||Date.now()});sync.lib=r.token;sync.synced=r.updatedAt;saveSync();return}
    if(sync.mtime<=sync.synced)return;
    await api('PUT',`/libs/${sync.lib}`,{db,updatedAt:sync.mtime});sync.synced=sync.mtime;saveSync();
  }catch(e){if(e.status===409)await pullLib();else if(e.status===404){sync.lib='';saveSync()}}})();
  try{await pushing}finally{pushing=null}
}
async function pullLib(){
  if(!sync.lib)return pushLib();
  try{const r=await api('GET',`/libs/${sync.lib}`);
    if(r.updatedAt>sync.mtime&&!(isEmpty(r.db)&&!isEmpty(db))){if(!$('#dlg').open)adopt(r.db,r.updatedAt)}
    else if(sync.mtime>r.updatedAt)schedulePush();
  }catch(e){if(e.status===404){sync.lib='';saveSync();pushLib()}}
}
async function adoptLink(){
  const m=location.hash.match(/^#lib=([A-Za-z0-9_-]{24,64})$/);if(!m)return;
  history.replaceState(null,'',location.pathname+location.search);
  if(m[1]===sync.lib)return;
  let r;try{r=await api('GET',`/libs/${m[1]}`)}catch(e){return msg(e.status===404?'That device link isn’t valid.':'Couldn’t reach your synced books — try the link again later.')}
  if(!isEmpty(db)&&!confirm('Replace the books on this device with your synced library?'))return;
  sync.lib=m[1];adopt(r.db,r.updatedAt);msg('This device is now synced.');
}
async function shareLib(){
  if(!sync.lib)await pushLib();
  if(!sync.lib)return msg('Couldn’t set up syncing — check your connection.');
  linkBox('Use on another device','Open this link on your other phone, tablet or computer. Your books will stay in sync. Keep it private — anyone with it can see your lists.',location.origin+location.pathname+'#lib='+sync.lib,'My books');
}
addEventListener('focus',()=>{pullLib();syncPending()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){pullLib();syncPending()}});
addEventListener('online',()=>{pushLib();syncPending()});
render();
adoptLink().then(pullLib).then(syncPending);
</script>
